name: Bug report
description: Something in the Neural Lens does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting.

        **Before you attach anything:** screenshots of the lens show whatever was behind
        it, which is your desktop. Crop tightly, and check for window titles, notifications,
        file paths and account names before uploading. Logs are usually more useful than
        screenshots anyway.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The steps you took, in order. Say whether it happens every time.
      placeholder: |
        1. Launched the lens
        2. Dragged it over ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Neural Lens version
      description: Shown at the top of the menu, at the top of Settings, and printed when the lens starts.
      placeholder: 0.3.0
    validations:
      required: true

  - type: dropdown
    id: passes
    attributes:
      label: How many passes
      options: ["1", "2", "3", "4"]
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Windowed or fullscreen
      description: Fullscreen switches the Cost Scaler on, so this decides where to look first.
      options: ["Windowed", "Fullscreen"]
    validations:
      required: true

  - type: input
    id: behind
    attributes:
      label: What was behind the lens
      description: The kind of window, for example a browser, a still image, a video, a remote desktop session.
      placeholder: Firefox playing a video
    validations:
      required: true

  - type: input
    id: size
    attributes:
      label: Lens size and display
      description: The first line of lens-state.txt in the data folder beside the lens, plus your display resolution and refresh rate.
      placeholder: 1400 1000 500 400 2, on a 3840x2160 display at 144 Hz
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run winver and give the version and build.
      placeholder: 24H2, build 26100
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: RTX 4080, driver 580.10
    validations:
      required: true

  - type: textarea
    id: stack
    attributes:
      label: Neural Rendering stack
      description: Versions of ReShade, dlss5-feed, renodx-dlss5, the Cost Scaler and nvngx_dlssnr.dll. Most are recorded in install-record.json in the lens folder.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Logs from the failing run
      description: |
        Every launch archives the previous session's logs to `data\logs` beside the lens, or
        wherever `data_dir` points. So launch once more after the problem, then attach
        the newest archived `ReShade.log`. The line that confirms Neural Rendering was
        running is `feature=18 (DLSSNR`.

        If the lens never opened, or its picture never appeared, attach
        `presenter-stderr.log` from the same folder instead. That is what the presenter
        itself printed, and it is the only place the reason survives.

        For anything about the picture, the frame rate or the Cost Scaler, attach `lens.log`
        from that folder too, and the archived `nvngx_dlssnr_proxy.log` if there is one.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Things worth checking first
      options:
        - label: The lens did not warn me at startup that Neural Rendering will probably not run.
        - label: I tried the menu's Turn NR off and Turn NR back on (F6). With NR on the picture changes clearly.
        - label: I checked the archived ReShade.log for `feature=18 (DLSSNR`.
        - label: I read the Limits section of the README, in case this is a known constraint.
        - label: My screenshots, if any, do not show anything I mind being public.
